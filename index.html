// 改善版 openApp: iframeでdeepLink試行 → 可視なら外部ブラウザ強制 → 最後に_blank
function openApp(deep, fb){
 const ua=navigator.userAgent;
 const isIOS=/iPhone|iPad|iPod/i.test(ua);
 const isAnd=/Android/i.test(ua);
 let fbUrl=fb.other;
 if(isIOS) fbUrl=fb.ios;
 else if(isAnd) fbUrl=fb.android;

 let hidden=false;
 const onHide=()=>{hidden=true;};
 document.addEventListener('visibilitychange',onHide);
 window.addEventListener('pagehide',onHide);
 window.addEventListener('blur',onHide);

 // 1. deep linkをiframeで試す（ページ遷移を防ぐ）
 try{
  const ifr=document.createElement('iframe');
  ifr.style.display='none';
  ifr.src=deep;
  document.body.appendChild(ifr);
  setTimeout(()=>{try{document.body.removeChild(ifr);}catch{}},2000);
 }catch{}

 // 2. 念のため location.hrefでも試す（アプリ起動用）
 try{ window.location.href=deep; }catch{}

 // 3. 1.2秒後にまだ表示されていたらApp Store/外部ブラウザに強制遷移
 setTimeout(()=>{
  if(hidden || document.hidden || document.visibilityState==='hidden'){
   document.removeEventListener('visibilitychange',onHide);
   window.removeEventListener('pagehide',onHide);
   window.removeEventListener('blur',onHide);
   return;
  }
  // iOSは x-safari- でSafari強制 → ダメなら _blank
  if(isIOS){
   try{
    // x-safari- は iOSでSafariを強制的に開く
    window.location.href=bUrl(['x','-','safari','-',fbUrl]);
   }catch{}
   setTimeout(()=>{
    if(!hidden && document.visibilityState!=='hidden'){
     window.open(fbUrl,'_blank');
    }
   },400);
  } else if(isAnd){
   // Androidは intent で Chrome強制
   try{
    const noProto=fbUrl.replace(/^https:\/\//,'');
    const intent=bUrl(['intent',':','/','/',noProto,'#','Intent',';','scheme','=','https',';','package','=','com','.','android','.','chrome',';','end']);
    window.location.href=intent;
   }catch{}
   setTimeout(()=>{
    if(!hidden && document.visibilityState!=='hidden'){
     window.open(fbUrl,'_blank');
    }
   },400);
  } else {
   window.open(fbUrl,'_blank');
  }
  document.removeEventListener('visibilitychange',onHide);
  window.removeEventListener('pagehide',onHide);
  window.removeEventListener('blur',onHide);
 },1200);
}
